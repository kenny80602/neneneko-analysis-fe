# 前端獨立起服務。後端另跑 stock-market-analysis 的 make run（web server 監聽 8081）。
#
# API 位址走「執行期」注入（一顆 image 走多環境）：容器啟動時由
# /docker-entrypoint.d/40-config-js.sh 依 API_BASE 產生 /config.js，前端 runtime 讀取。
# 改後端網址不需重 build，改 environment 即可：
#   API_BASE=https://api.your-domain.com docker compose up -d
#
# 注意 API_BASE 是「瀏覽器」要連的位址，不是容器之間的位址——
# 填 http://app:8081 這種 compose 內部名稱，瀏覽器解析不到。
#
# 後端的 APP_ALLOWED_ORIGINS 也要放行這個前端的 origin，否則所有請求都會被 CORS 擋下。
# 本機的 localhost 後端已無條件放行（見後端 ioc/web.go 的 isAllowedOrigin），不必另外設。
#
# 用法：
#   docker compose up -d --build
#   瀏覽器開 http://localhost:3000
services:
  web:
    build:
      context: .
    image: stock-market-analysis-fe:local
    restart: unless-stopped
    environment:
      # 瀏覽器實際連的後端位址（含 LINE Login 的轉址）；預設指向本機後端。
      API_BASE: ${API_BASE:-http://localhost:8081}
    ports:
      - "3000:80"   # 對外 3000 → 容器內 nginx 80
