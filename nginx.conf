server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 帶 hash 的靜態資源可長快取；index.html 不快取以確保取得新版
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # config.js 由容器啟動時產生，內容隨環境不同，不能快取——
    # 快取住的話換環境重啟後，瀏覽器還是拿舊的後端位址。
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # SPA fallback：未知路徑一律回 index.html 交給 React Router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
